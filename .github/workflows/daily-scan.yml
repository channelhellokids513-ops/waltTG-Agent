name: Daily Walt Perps Funding Scan & Auto-Execute

on:
  schedule:
    # Master Scan 2x sehari: 00:17 UTC (07:17 WIB) & 12:17 UTC (19:17 WIB)
    # Menghasilkan riset Swarm AI mendalam dan memperbarui database spreadsheet
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      auto_execute:
        description: "Auto-execute GO/HALF signals (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Dry run (simulate without real order)"
        required: false
        default: "false"

concurrency:
  group: walt-trading-account
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore and persist logs/snapshot cache
        uses: actions/cache@v4
        with:
          path: logs/
          key: walt-logs-state-${{ github.run_id }}
          restore-keys: |
            walt-logs-state-

      - name: Run daily scan and auto-execute
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen-plus' }}
          DASHSCOPE_API_GEMINI_KEY: ${{ secrets.DASHSCOPE_API_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID || '1ag6MqYnOLdZgkFwk_cs3W-22EOX5e5DGQTVvPWENHTg' }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTO_EXECUTE_ON_SCAN: ${{ github.event.inputs.auto_execute || vars.AUTO_EXECUTE_ON_SCAN || 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
        run: |
          set -o pipefail
          python walt_bot.py scan_with_research 2>&1 | tee scan_output.log

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walt-scan-logs
          path: logs/
          retention-days: 30

      - name: Publish Summary
        if: always()
        run: |
          echo "## 📊 Hasil Scan & Auto-Execute Bot" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f scan_output.log ]; then
            cat scan_output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "File log tidak ditemukan." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
