name: Daily Walt Perps Funding Scan & Auto-Execute

# Trigger resmi berasal dari Google Cloud Scheduler (memanggil workflow_dispatch).
# Cron GitHub Actions dihapus untuk mencegah eksekusi dobel / terlambat berjam-jam.
on:
  workflow_dispatch:
    inputs:
      auto_execute:
        description: "Auto-execute GO/HALF signals (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Dry run (simulate without real order)"
        required: false
        default: "false"

concurrency:
  group: walt-trading-account
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: vars.MAINTENANCE_MODE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore logs/snapshot cache
        id: restore_state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/
          key: walt-logs-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            walt-logs-state-

      - name: Run daily scan and auto-execute
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen-plus' }}
          DASHSCOPE_API_GEMINI_KEY: ${{ secrets.DASHSCOPE_API_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOB_TIMEOUT_MIN: "12"
          LOG_REDACT: "true"
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          AUTO_EXECUTE_ON_SCAN: ${{ github.event.inputs.auto_execute || vars.AUTO_EXECUTE_ON_SCAN || 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
          WALT_STATE_WARM: ${{ steps.restore_state.outputs.cache-hit == 'true' }}
        run: |
          mkdir -p logs
          set -o pipefail
          python walt_bot.py scan_with_research

      - name: Exclude open_snapshot.json from non-monitor cache
        if: always()
        run: rm -f logs/open_snapshot.json

      - name: Save logs/snapshot cache (always)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/
          key: walt-logs-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("logs/last_safe_summary.json")
          s = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print("## 📊 Ringkasan Daily Scan & Research (Redacted)")
          print(f"- **Job Status:** `{os.getenv('JOB_STATUS', 'unknown')}`")
          print(f"- **Opportunities Count:** `{s.get('opportunities_count', 0)}`")
          print(f"- **Executions Count:** `{s.get('executions_count', 0)}`")
          print(f"- **Gear:** market=`{s.get('market_gear', '-')}`, crypto=`{s.get('crypto_gear', '-')}`")
          print(f"- **State Warm (cache hit):** `{s.get('state_warm', 'tidak tercatat')}`")
          PY
