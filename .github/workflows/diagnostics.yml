name: Walt Read-Only Diagnostics

# Sengaja TIDAK diberi guard MAINTENANCE_MODE karena workflow read-only ini justru dipakai selama jendela pemeliharaan.
# Urutan langkah (Ronde 6): yang TIDAK butuh kredensial Walt jalan lebih dulu, supaya diagnostik tetap
# menghasilkan data saat refresh token mati (sheet read + stats) — baru kemudian langkah bursa.
on:
  workflow_dispatch:
    inputs:
      oauth_step:
        description: 'Refresh token Walt single-use: tepat SATU langkah per job yang boleh menyentuh OAuth (read_only = nol OAuth)'
        required: false
        default: 'dump_closed'
        type: choice
        options:
          - dump_closed
          - reconcile_history
          - reconcile_write
          - read_only

concurrency:
  group: walt-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sheet read probe (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
        run: |
          set -o pipefail
          { echo "## 🔍 Walt Read-Only Diagnostics (Redacted)"; echo; echo "### 0. Sheet read probe (sidik jari sha8, ID tidak pernah dicetak)"; echo '```text'; python tools/sheet_probe.py | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ledger stats (tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
        run: |
          set -o pipefail
          mkdir -p logs
          { echo "### 1. \`stats\` Summary (sumber: sheet/CSV, tidak menyentuh bursa)"; echo '```text'; python walt_bot.py stats | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # R7: jalur baca riset bisa diverifikasi SEBANYAK yang dibutuhkan tanpa menyentuh token
      # (redeploy Apps Script harus terbukti dari CI, bukan dari dugaan — dan dispatch workflow
      # entry hanya untuk mengujinya justru berisiko membakar token yang sedang dipakai siklus lain).
      - name: Config coherence check (read-only, tanpa kredensial Walt)
        env:
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
        run: |
          set -o pipefail
          { echo "### 1c. Koherensi konfigurasi (pasangan angka, bukan rentang satuan)"; echo '```text'; python tools/config_coherence.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ledger identity census (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
        run: |
          set -o pipefail
          { echo "### 1d. Sensus identitas baris Closed_Positions (penahan duplikat backfill)"; echo '```text'; python tools/ledger_census.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Research read probe (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
        run: |
          set -o pipefail
          mkdir -p logs
          { echo "### 1b. Jalur baca riset (webhook \`doGet\` + fallback CSV)"; echo '```text'; python tools/research_probe.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # [R7-d] Backfill SEDARBELUM: mirror riwayat closed bursa ke ledger sheet. Operasi tidak
      # bisa dibatalkan, jadi mode ini harus dipilih eksplisit (default workflow = dump_closed) dan
      # dedupe-nya membaca sheet lebih dulu — lihat tests/test_remediation_r7_backfill.py.
      - name: Ledger reconciliation WRITE + mirror sheet (butuh OAuth; menulis ledger)
        if: always() && github.event.inputs.oauth_step == 'reconcile_write'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"
        run: |
          set -o pipefail
          { echo "### 4. \`reconcile_history --write --mirror-sheet\` (menulis ledger lokal + sheet)"; echo '```text'; python walt_bot.py reconcile_history --write --mirror-sheet | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Exchange schema dump (butuh OAuth Walt; menulis balik rotasi token)
        if: always() && github.event.inputs.oauth_step == 'dump_closed'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"  # R6-fix: refresh OAuth membakar token single-use => wajib menulis balik
        run: |
          set -o pipefail
          { echo "### 2. \`dump_closed\` Schema + pengukuran riwayat bursa"; echo '```json'; python walt_bot.py dump_closed | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # R6-1 lanjutan: baseline riwayat closed bursa vs ledger, TANPA menulis apa pun (--write tetap manual).
      - name: Ledger reconciliation dry-run (butuh OAuth; tidak menulis berkas)
        if: always() && github.event.inputs.oauth_step == 'reconcile_history'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"
        run: |
          set -o pipefail
          { echo "### 3. \`reconcile_history\` dry-run (riwayat bursa vs ledger; tidak ada file diubah)"; echo '```text'; python walt_bot.py reconcile_history | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
