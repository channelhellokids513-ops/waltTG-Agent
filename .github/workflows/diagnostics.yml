name: Walt Read-Only Diagnostics

# Sengaja TIDAK diberi guard MAINTENANCE_MODE karena workflow read-only ini justru dipakai selama jendela pemeliharaan.
# Urutan langkah (Ronde 6): yang TIDAK butuh kredensial Walt jalan lebih dulu, supaya diagnostik tetap
# menghasilkan data saat refresh token mati (sheet read + stats) — baru kemudian langkah bursa.
on:
  workflow_dispatch:
    inputs:
      oauth_step:
        description: 'Refresh token Walt single-use: tepat SATU langkah per job yang boleh menyentuh OAuth (read_only = nol OAuth)'
        required: false
        default: 'dump_closed'
        type: choice
        options:
          - dump_closed
          - reconcile_history
          - reconcile_write
          - contract_economics
          - slippage_probe
          - read_only
      real_order:
        description: 'PINTU KEDUA untuk langkah yang membuat order NYATA (slippage_probe). Pilihan lain = tidak ada order.'
        required: false
        default: 'TIDAK_ORDER'
        type: choice
        options:
          - TIDAK_ORDER
          - YA_ORDER_NYATA
      probe_margin:
        description: 'Margin USD untuk slippage_probe (menguji ambang clip bursa). Di luar itu tidak dipakai.'
        required: false
        default: '2.50'
        type: choice
        options:
          - '2.50'
          - '3.00'
          - '5.00'
      probe_asset:
        description: 'Kontrak yang diprobe. Kosong=BTC lalu ETH. Untuk mengukur slippage keluar, pilih aset yang posisinya bertahan di live (mis. XAG).'
        required: false
        default: 'XAG'
        type: choice
        options:
          - XAG
          - ETH
          - BTC
          - PLTR
      probe_no_tpsl:
        description: 'Isolasi autoClose: 1 = buka TANPA TP/SL (menguji apakah pemasangan TP/SL yang membuat posisi tertutup seketika).'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

concurrency:
  group: walt-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sheet read probe (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
        run: |
          set -o pipefail
          { echo "## 🔍 Walt Read-Only Diagnostics (Redacted)"; echo; echo "### 0. Sheet read probe (sidik jari sha8, ID tidak pernah dicetak)"; echo '```text'; python tools/sheet_probe.py | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ledger stats (tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
        run: |
          set -o pipefail
          mkdir -p logs
          { echo "### 1. \`stats\` Summary (sumber: sheet/CSV, tidak menyentuh bursa)"; echo '```text'; python walt_bot.py stats | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # R7: jalur baca riset bisa diverifikasi SEBANYAK yang dibutuhkan tanpa menyentuh token
      # (redeploy Apps Script harus terbukti dari CI, bukan dari dugaan — dan dispatch workflow
      # entry hanya untuk mengujinya justru berisiko membakar token yang sedang dipakai siklus lain).
      - name: Config coherence check (read-only, tanpa kredensial Walt)
        env:
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
        run: |
          set -o pipefail
          { echo "### 1c. Koherensi konfigurasi (pasangan angka, bukan rentang satuan)"; echo '```text'; python tools/config_coherence.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ledger identity census (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
        run: |
          set -o pipefail
          { echo "### 1d. Sensus identitas baris Closed_Positions (penahan duplikat backfill)"; echo '```text'; python tools/ledger_census.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Slippage report (baca logs/ dari cache; read-only)
        if: always()
        run: |
          set -o pipefail
          { echo "### 1e. Slippage terukur dari jalur produksi"; echo '```text'; python tools/slippage_report.py | tee -a "$GITHUB_STEP_SUMMARY"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY" || echo "(belum ada pengukuran: file logs/slippage_observed.jsonl kosong atau cache logs tidak dipulihkan di job ini)"

      - name: Webhook deployment probe (verifikasi redeploy Apps Script; tanpa kredensial Walt)
        if: always()
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          LOG_REDACT: "true"
        run: |
          set -o pipefail
          { echo "### 1d. Verifikasi deployment Apps Script (?probe=1)"; echo '```text'; python tools/webhook_probe.py --expect-version 2026-11-21.1 | tee -a "$GITHUB_STEP_SUMMARY"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Research read probe (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
        run: |
          set -o pipefail
          mkdir -p logs
          { echo "### 1b. Jalur baca riset (webhook \`doGet\` + fallback CSV)"; echo '```text'; python tools/research_probe.py | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # [R7-d] Backfill SEDARBELUM: mirror riwayat closed bursa ke ledger sheet. Operasi tidak
      # bisa dibatalkan, jadi mode ini harus dipilih eksplisit (default workflow = dump_closed) dan
      # dedupe-nya membaca sheet lebih dulu — lihat tests/test_remediation_r7_backfill.py.
      - name: Ledger reconciliation WRITE + mirror sheet (butuh OAuth; menulis ledger)
        if: always() && github.event.inputs.oauth_step == 'reconcile_write'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"
        run: |
          set -o pipefail
          { echo "### 4. \`reconcile_history --write --mirror-sheet\` (menulis ledger lokal + sheet)"; echo '```text'; python walt_bot.py reconcile_history --write --mirror-sheet | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Exchange schema dump (butuh OAuth Walt; menulis balik rotasi token)
        if: always() && github.event.inputs.oauth_step == 'dump_closed'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"  # R6-fix: refresh OAuth membakar token single-use => wajib menulis balik
        run: |
          set -o pipefail
          { echo "### 2. \`dump_closed\` Schema + pengukuran riwayat bursa"; echo '```json'; python walt_bot.py dump_closed | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # R6-1 lanjutan: baseline riwayat closed bursa vs ledger, TANPA menulis apa pun (--write tetap manual).
      # Ronde 8: ukur BIAYA ROUND-TRIP NYATA. Read-only: hanya list_contracts /
      # list_positions; execute DAN prepare diblok oleh alatnya sendiri (dites di
      # tests/test_contract_economics.py), jadi tidak ada jalur dari UI ini ke order.
      - name: Contract economics measurement (butuh OAuth; read-only, tidak menulis apa pun)
        if: always() && github.event.inputs.oauth_step == 'contract_economics'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"  # refresh OAuth membakar token single-use => wajib menulis balik
        run: |
          set -o pipefail
          { echo "### 2. contract_economics - biaya round-trip terukur (read-only)"; echo '```text'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/contract_economics.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Ronde 8: satu order NYATA untuk mengukur slippage murni. Butuh DUA konfirmasi:
      # oauth_step=slippage_probe DAN real_order=YA_ORDER_NYATA. Alatnya sendiri menolak
      # bila MAINTENANCE_MODE != true atau masih ada posisi terbuka.
      - name: Slippage probe (ORDER NYATA - buka lalu tutup satu clip terkecil)
        if: always() && github.event.inputs.oauth_step == 'slippage_probe'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"
          SLIPPAGE_PROBE_CONFIRM: "saya-ersetuju-order-nyata"
          SLIPPAGE_PROBE_REAL_ORDER: ${{ github.event.inputs.real_order }}
          PROBE_NO_TP_SL: ${{ github.event.inputs.probe_no_tpsl }}
          PROBE_ASSET: ${{ github.event.inputs.probe_asset }}
        run: |
          set -o pipefail
          { echo "### 3. slippage_probe - satu order nyata (buka lalu tutup)"; echo '```text'; } >> "$GITHUB_STEP_SUMMARY"
          python tools/slippage_probe.py --margin "${{ github.event.inputs.probe_margin }}" --hold-seconds 90 --allow-other-positions | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ledger reconciliation dry-run (butuh OAuth; tidak menulis berkas)
        if: always() && github.event.inputs.oauth_step == 'reconcile_history'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"
        run: |
          set -o pipefail
          { echo "### 3. \`reconcile_history\` dry-run (riwayat bursa vs ledger; tidak ada file diubah)"; echo '```text'; python walt_bot.py reconcile_history | tee -a "$GITHUB_STEP_SUMMARY" | tee /dev/stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
