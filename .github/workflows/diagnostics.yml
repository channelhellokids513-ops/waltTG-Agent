name: Walt Read-Only Diagnostics

# Sengaja TIDAK diberi guard MAINTENANCE_MODE karena workflow read-only ini justru dipakai selama jendela pemeliharaan.
on:
  workflow_dispatch:

concurrency:
  group: walt-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sheet read probe (read-only, tanpa kredensial Walt)
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
        run: |
          set -o pipefail
          { echo "### 0. Sheet read probe (sanitized, sha8 saja)"; echo '```text'; python tools/sheet_probe.py | tee /dev/stderr; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run read-only dump_closed and stats
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          LOG_REDACT: "true"
          WALT_TOKEN_SYNC: "on"  # R6-fix: refresh OAuth membakar token single-use => wajib menulis balik
        run: |
          set -o pipefail
          mkdir -p logs
          echo "## 🔍 Walt Read-Only Diagnostics (Redacted)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 1. \`dump_closed\` Schema" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python walt_bot.py dump_closed | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 2. \`stats\` Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python walt_bot.py stats | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
