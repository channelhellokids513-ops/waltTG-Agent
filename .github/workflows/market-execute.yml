name: Walt Market-Open Execute (US stocks)

on:
  schedule:
    # 09:43 ET Mon-Fri (13 menit setelah US market open 09:30 ET)
    # Dua entry: EDT (UTC-4) dan EST (UTC-5). Runtime check mencegah double-run.
    - cron: '43 13 * * 1-5'   # 09:43 EDT (Mar-Nov)
    - cron: '43 14 * * 1-5'   # 09:43 EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only, no execute)"
        required: false
        default: "false"

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check NY time (skip wrong UTC offset)
        id: ny_time_check
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          NY_HOUR=$(TZ=America/New_York date +%H)
          NY_MIN=$(TZ=America/New_York date +%M)
          echo "Current NY time: ${NY_HOUR}:${NY_MIN}"

          if [ "$NY_HOUR" = "09" ] && [ "$NY_MIN" -ge 40 ] && [ "$NY_MIN" -le 50 ]; then
            echo "run_execute=true" >> "$GITHUB_OUTPUT"
            echo "✅ Within 09:40–09:50 ET window. Proceeding."
          else
            echo "run_execute=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Not in 09:40–09:50 ET window. Skipping scheduled trigger."
          fi

      - name: Execute planned positions
        if: github.event_name != 'schedule' || steps.ny_time_check.outputs.run_execute == 'true'
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_GEMINI_KEY: ${{ secrets.DASHSCOPE_API_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID || '1ag6MqYnOLdZgkFwk_cs3W-22EOX5e5DGQTVvPWENHTg' }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python walt_bot.py market_execute 2>&1 | tee execute_output.log

      - name: Upload Logs Artifact
        if: always() && (github.event_name != 'schedule' || steps.ny_time_check.outputs.run_execute == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: walt-execute-logs
          path: logs/
          retention-days: 30

      - name: Publish Summary
        if: always() && (github.event_name != 'schedule' || steps.ny_time_check.outputs.run_execute == 'true')
        run: |
          echo "## 🚀 Hasil Market Execute" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f execute_output.log ]; then
            cat execute_output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "File log tidak ditemukan." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY