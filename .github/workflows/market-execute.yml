name: Walt Market Execute (24/7 Saham US & Komoditas)

on:
  schedule:
    # Berjalan setiap 2 jam di menit ke-43 UTC (24/7 Saham US & Komoditas):
    # (WIB: 08:43, 10:43, 12:43, 14:43, 16:43, 18:43, 20:43, 22:43, 00:43, 02:43, 04:43, 06:43 WIB)
    - cron: '43 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only, no execute)"
        required: false
        default: "false"

concurrency:
  group: walt-trading-account
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute planned positions
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_GEMINI_KEY: ${{ secrets.DASHSCOPE_API_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID || '1ag6MqYnOLdZgkFwk_cs3W-22EOX5e5DGQTVvPWENHTg' }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python walt_bot.py market_execute 2>&1 | tee execute_output.log

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walt-execute-logs
          path: logs/
          retention-days: 30

      - name: Publish Summary
        if: always()
        run: |
          echo "## 🚀 Hasil Market Execute (24/7)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f execute_output.log ]; then
            cat execute_output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "File log tidak ditemukan." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY