name: Walt Risk Monitor (10-Min Smart Guard)

# Trigger resmi berasal dari Google Cloud Scheduler (memanggil workflow_dispatch).
# Cron GitHub Actions dihapus untuk mencegah eksekusi dobel / terlambat berjam-jam.
on:
  workflow_dispatch:

concurrency:
  group: walt-trading-account
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # [R7b] khusus keepalive watchdog (dispatch workflow di repo yang sama); tidak ada akses tulis contents

jobs:
  monitor:
    if: vars.MAINTENANCE_MODE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore logs/state cache
        id: restore_state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/
          key: walt-logs-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            walt-logs-state-

      - name: Restore risk-monitor open_snapshot cache
        id: restore_snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/open_snapshot.json
          key: walt-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            walt-snapshot-

      - name: Detect restored state (butuh regime + snapshot, bukan cache-hit exact key)
        id: state_probe
        run: |
          warm=false
          if [ -f logs/market_regime.json ] && [ -f logs/open_snapshot.json ]; then warm=true; fi
          echo "warm=$warm" >> "$GITHUB_OUTPUT"
          echo "WALT_STATE_WARM akan=$warm (regime $([ -f logs/market_regime.json ] && echo ADA || echo HILANG), snapshot $([ -f logs/open_snapshot.json ] && echo ADA || echo HILANG))"

      - name: Run risk monitor
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          WALT_TOKEN_SYNC: "on"  # eksplisit: default on pernah hampir membakar token tanpa jalur tulis-balik (invarian R8)
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'glm-5.3-prime' }}
          DASHSCOPE_MODEL_V1: ${{ vars.DASHSCOPE_MODEL_V1 || 'glm-5.2-fast-preview' }}
          DASHSCOPE_API_GEMINI_KEY: ${{ secrets.DASHSCOPE_API_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://router.classai.id/v1' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'minimax-m3' }}
          GEMINI_MODEL_V4: ${{ vars.GEMINI_MODEL_V4 || 'claude-haiku-5.5' }}
          CLASSAI_MODEL_AGG: ${{ vars.CLASSAI_MODEL_AGG || 'glm-5.3' }}
          CLASSAI_MODEL_AGG_FALLBACK: ${{ vars.CLASSAI_MODEL_AGG_FALLBACK || 'claude-opus-5.5' }}
          OAK_MCP_ENABLED: ${{ vars.OAK_MCP_ENABLED || 'on' }}
          OAK_MCP_CLIENT_ID: ${{ secrets.OAK_MCP_CLIENT_ID }}
          OAK_MCP_REFRESH_TOKEN: ${{ secrets.OAK_MCP_REFRESH_TOKEN }}
          OAK_MCP_ACCESS_TOKEN: ${{ secrets.OAK_MCP_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOB_TIMEOUT_MIN: "20"
          LOG_REDACT: "true"
          STRATEGY_CONFIG_JSON: ${{ vars.STRATEGY_CONFIG_JSON }}
          US_STOCK_HOURS_ONLY: ${{ vars.US_STOCK_HOURS_ONLY }}
          WALT_STATE_WARM: ${{ steps.state_probe.outputs.warm }}
          # R7: jarak ledger-vs-bursa saat start dingin; default `report` = tidak ada penulisan.
          WALT_COLD_REHYDRATE: ${{ vars.WALT_COLD_REHYDRATE || 'report' }}
        run: |
          mkdir -p logs
          set -o pipefail
          python walt_bot.py monitor

      - name: Save risk-monitor open_snapshot cache (always)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/open_snapshot.json
          key: walt-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save logs/state cache (always)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: logs/
          key: walt-logs-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("logs/last_safe_summary.json")
          s = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print("## 🛡️ Ringkasan Risk Monitor (Redacted)")
          print(f"- **Job Status:** `{os.getenv('JOB_STATUS', 'unknown')}`")
          print(f"- **Cadence Mode:** `{s.get('cadence_mode', '-')}` (cycles: `{s.get('cycles_run', '-')}`)")
          print(f"- **Positions Checked:** `{s.get('positions_checked', '-')}`")
          print(f"- **Actions Count:** `{s.get('actions_count', 0)}`")
          print(f"- **Gear:** market=`{s.get('market_gear', '-')}`, crypto=`{s.get('crypto_gear', '-')}`")
          print(f"- **State Warm (cache hit):** `{s.get('state_warm', 'tidak tercatat')}`")
          PY

      # [R7b] Cron GitHub bukan jangkar yang bisa dipercaya (README §281; terbukti ~7 jam tanpa run
      # `schedule` pada 2026-11-20). Risk Monitor adalah workflow paling sering jalan, jadi ia ikut
      # menghidupkan watchdog. Self-throttled: hanya dispatch bila run watchdog > 50 menit.
      - name: Keep watchdog alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE || 'false' }}
          WATCHDOG_KEEPALIVE: ${{ vars.WATCHDOG_KEEPALIVE || 'true' }}
        run: |
          set -o pipefail
          echo "### Keepalive watchdog" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import sys; sys.path.insert(0, 'tools'); from watchdog_check import keep_watchdog_alive; raise SystemExit(keep_watchdog_alive())" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
