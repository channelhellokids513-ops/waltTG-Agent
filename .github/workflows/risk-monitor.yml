name: Walt Risk Monitor (4h)

on:
  schedule:
    # Tiap 4 jam di menit 35 UTC: 00:35, 04:35, 08:35, 12:35, 16:35, 20:35
    - cron: '35 */4 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run risk monitor
        env:
          WALT_CLIENT_ID: ${{ secrets.WALT_CLIENT_ID }}
          WALT_REFRESH_TOKEN: ${{ secrets.WALT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GH_PATH || secrets.GITHUB_PAT || secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python walt_bot.py monitor 2>&1 | tee monitor_output.log

      - name: Publish Summary
        if: always()
        run: |
          echo "## 🛡️ Hasil Risk Monitor" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f monitor_output.log ]; then
            cat monitor_output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "File log tidak ditemukan." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
