name: CI Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: walt-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify core module imports
        run: python -c "import walt_bot, token_manager, sheet_logger, notifier"

      - name: Run pytest
        run: pytest -q

      - name: Validate workflow YAML syntax
        run: python -c "import yaml, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in sorted(glob.glob('.github/workflows/*.yml'))]; print('YAML OK')"
