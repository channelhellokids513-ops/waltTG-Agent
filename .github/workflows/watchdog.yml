name: Walt Risk Monitor Watchdog

# R6-3: watchdog kini memeriksa KEEMPAT workflow trading, bukan hanya risk-monitor.
# daily-scan / market-execute / crypto-execute dipicu Google Cloud Scheduler eksternal, jadi
# kalau job Scheduler mati entri berhenti tanpa satu pun alert sebelumnya.
#
# Ambang usia per workflow diturunkan dari tabel jadwal terdokumentasi
# (STRATEGY.md §7.1 dan README §113-117) — lihat SPECS di tools/watchdog_check.py:
#   risk-monitor.yml    cadence 10 m  -> ambang  30 m (nilai warisan, dipertahankan)
#   market-execute.yml  cadence 120 m -> ambang 300 m (2x cadence + grace 60 m)
#   crypto-execute.yml  cadence 120 m -> ambang 300 m (2x cadence + grace 60 m)
#   daily-scan.yml      cadence 720 m -> ambang 840 m (cadence + grace 120 m)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: walt-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check age of last success for all four trading workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE || 'false' }}
          WALT_WATCHDOG_DISPATCH_ENTRY: ${{ vars.WALT_WATCHDOG_DISPATCH_ENTRY || 'false' }}
        run: python3 tools/watchdog_check.py
